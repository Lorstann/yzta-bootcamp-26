# Alembic Konfigürasyonu
# D3: Equa projesi migration ayarları

[alembic]
# Migration script klasörü
script_location = backend/alembic

# Migration dosyalarının adı formatı: 001_create_tenants.py gibi
file_template = %%(rev)s_%%(slug)s

# SQLAlchemy bağlantı URL'i — .env'den okunur (env.py'de override edilir)
sqlalchemy.url = postgresql+asyncpg://equa:equa_dev@localhost:5432/equa

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

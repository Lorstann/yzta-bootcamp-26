services:
  db:
    image: pgvector/pgvector:pg16
    container_name: equa_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: equa
      POSTGRES_USER: equa
      POSTGRES_PASSWORD: equa_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equa -d equa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

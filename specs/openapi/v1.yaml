openapi: 3.0.3
info:
  title: Equa API
  version: 1.0.0
  description: |
    Equa B2B2C MVP API contract.
    Breaking changes require a new major path (`/api/v2`).
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: system
  - name: auth
  - name: chat
  - name: checkins
  - name: profiles
  - name: institution
paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a student account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/chat/stream:
    post:
      tags: [chat]
      summary: Stream a chat reply as Server-Sent Events
      operationId: streamChat
      description: |
        Accepts a student message and streams SSE events.
        Requires Bearer JWT; tenant is taken from the token.
        Each `data:` line is a JSON object with `type` of `chunk`, `done`, or `error`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of chat events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE payload lines of the form `data: {json}\n\n`.
                  Event shapes:
                  - `{"type":"chunk","data":"..."}`
                  - `{"type":"done","guardrail_triggered":false,"guardrail_category":null,"daily_tasks":["..."]}`
                  - `{"type":"error","message":"..."}`
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden (non-student role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Check-in session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/checkins:
    post:
      tags: [checkins]
      summary: Start or resume the current daily check-in
      operationId: startCheckin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current check-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinSessionResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/checkins/current:
    get:
      tags: [checkins]
      summary: Get or start the current daily check-in
      operationId: getCurrentCheckin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current check-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinSessionResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/checkins/history:
    get:
      tags: [checkins]
      summary: List past daily check-in sessions
      operationId: listCheckinHistory
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: Check-in history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinHistoryResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/checkins/current/mood:
    patch:
      tags: [checkins]
      summary: Set mood score for the current check-in (1-5)
      operationId: updateCurrentMood
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodUpdateRequest'
      responses:
        '200':
          description: Updated check-in session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinSessionResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/tasks:
    get:
      tags: [checkins]
      summary: List all daily tasks for the current student
      operationId: listTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/tasks/{task_id}:
    patch:
      tags: [checkins]
      summary: Mark a weekly task complete/incomplete
      operationId: patchTask
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCompleteRequest'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPatchResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/profiles/me:
    get:
      tags: [profiles]
      summary: Get current student profile
      operationId: getMyProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/profiles/me/stats:
    get:
      tags: [profiles]
      summary: Dashboard stats — check-in count, streak, capacity history
      operationId: getMyProfileStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileStatsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/profiles/me/onboarding:
    patch:
      tags: [profiles]
      summary: Update onboarding / capacity
      operationId: updateOnboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/profiles/me/linkedin:
    post:
      tags: [profiles]
      summary: Upload LinkedIn PDF for competency extraction
      operationId: uploadLinkedin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Extracted competencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyExtractResponse'
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/students:
    get:
      tags: [institution]
      summary: List students with risk scores (staff only)
      operationId: listInstitutionStudents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Student risk rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionStudentsResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/roi:
    get:
      tags: [institution]
      summary: ROI metrics for the tenant (staff only)
      operationId: getInstitutionRoi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ROI metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoiResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/overview:
    get:
      tags: [institution]
      summary: Tenant overview metrics (staff only)
      operationId: getInstitutionOverview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/usage:
    get:
      tags: [institution]
      summary: Adoption / usage metrics (staff only)
      operationId: getInstitutionUsage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usage metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/me:
    get:
      tags: [institution]
      summary: Staff profile + tenant info
      operationId: getInstitutionMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Staff profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/settings:
    patch:
      tags: [institution]
      summary: Update tenant settings (admin only)
      operationId: patchInstitutionSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revenue_per_student]
              properties:
                revenue_per_student:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 1000000
      responses:
        '200':
          description: Updated tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/students/{student_id}:
    get:
      tags: [institution]
      summary: Student XAI detail — metrics only, never raw chat
      operationId: getInstitutionStudent
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Student risk detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Student not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/assistant/stream:
    post:
      tags: [institution]
      summary: Stream institution AI assistant (metrics-only context)
      operationId: streamInstitutionAssistant
      description: |
        Staff-only SSE assistant. Context pack contains aggregate metrics and
        XAI rationales only — never raw student chat messages.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/curriculum:
    get:
      tags: [institution]
      summary: List active curricula for the tenant
      operationId: listInstitutionCurriculum
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Curriculum list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [institution]
      summary: Upload curriculum file (admin)
      operationId: uploadInstitutionCurriculum
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
      responses:
        '201':
          description: Curriculum ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/curriculum/text:
    post:
      tags: [institution]
      summary: Create curriculum from pasted text (admin)
      operationId: createInstitutionCurriculumText
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, text]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                text:
                  type: string
                  minLength: 1
                description:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '201':
          description: Curriculum ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/institution/curriculum/{curriculum_id}:
    delete:
      tags: [institution]
      summary: Soft-delete curriculum (admin)
      operationId: deleteInstitutionCurriculum
      security:
        - bearerAuth: []
      parameters:
        - name: curriculum_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Curriculum deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items: {}
          default: []

    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
        error:
          nullable: true
          type: object
        meta:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          type: object
          additionalProperties: true

    HealthData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          example: healthy

    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [tenant_slug, email, password, full_name]
      properties:
        tenant_slug:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          enum: [student]
          default: student

    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant_slug, email, password]
      properties:
        tenant_slug:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, tenant_id, email, role]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          nullable: true
          type: string
        role:
          type: string

    AuthTokenData:
      type: object
      additionalProperties: false
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
        user:
          $ref: '#/components/schemas/PublicUser'

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthTokenData'

    ChatRequest:
      type: object
      additionalProperties: false
      required: [session_id, message]
      properties:
        session_id:
          type: string
          format: uuid
          description: Check-in session UUID owned by the authenticated student.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Student message text.

    ChatSseChunkEvent:
      type: object
      additionalProperties: false
      required: [type, data]
      properties:
        type:
          type: string
          enum: [chunk]
        data:
          type: string

    ChatSseDoneEvent:
      type: object
      additionalProperties: false
      required: [type, guardrail_triggered]
      properties:
        type:
          type: string
          enum: [done]
        guardrail_triggered:
          type: boolean
        guardrail_category:
          nullable: true
          type: string
          enum: [critical, dropout, depression]
        daily_tasks:
          nullable: true
          type: array
          maxItems: 3
          items:
            type: string

    ChatSseErrorEvent:
      type: object
      additionalProperties: false
      required: [type, message]
      properties:
        type:
          type: string
          enum: [error]
        message:
          type: string

    ChatSseEvent:
      oneOf:
        - $ref: '#/components/schemas/ChatSseChunkEvent'
        - $ref: '#/components/schemas/ChatSseDoneEvent'
        - $ref: '#/components/schemas/ChatSseErrorEvent'
      discriminator:
        propertyName: type

    DailyTaskOut:
      type: object
      additionalProperties: false
      required: [id, title, is_completed]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:

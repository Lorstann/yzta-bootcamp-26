<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Equa — Çevrimdışı</title>
    <style>
      :root {
        color: #0c1f1c;
        font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
        background: #e8f0ec;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.75rem;
        background: #0f766e;
        color: #ecfdf5;
        font-family: Sora, ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.25rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-family: Sora, ui-sans-serif, system-ui, sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #3d5a54;
        font-size: 0.95rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">E</div>
      <h1>Çevrimdışısın</h1>
      <p>
        Equa kabuğu yüklü. Sohbet ve check-in için internet bağlantısı gerekli.
      </p>
    </main>
  </body>
</html>
